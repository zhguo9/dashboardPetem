name: 美团看板 - GitHub Pages 🚀

on:
  schedule:
    # 北京时间每天早上 9:30 = UTC 1:30（日报 9:00 之后跑）
    - cron: '30 1 * * *'
  workflow_dispatch:

# 权限：允许写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --quiet pandas numpy scipy plotly

      - name: 生成静态看板
        working-directory: ./
        run: python scripts/build_pages.py

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
